[project]
name = "ltm-ft"
version = "0.1.0"
description = "Fine-tuning TabFM (tabular foundation model) on synthetic data, compared with zero-shot in-context learning"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gleb Lukicov" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2",
    "pandas>=2.2",
    "safetensors>=0.4.3",
    "scikit-learn>=1.5",
    "tabfm[pytorch]>=1.0.1",
    "typer>=0.27",
]

[project.scripts]
ltm-ft = "ltm_ft:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tabfm", "tabfm.*", "sklearn", "sklearn.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
